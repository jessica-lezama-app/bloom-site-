<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloom</title>
<meta name="description" content="Bloom, ton suivi d'habitudes tout en douceur.">
<meta name="theme-color" content="#fdf2f4">
<style>
  :root { --bg:#fdf2f4; --fg:#3b2a30; --accent:#e0678a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#241a1e; --fg:#f7e9ed; --accent:#f08aa8; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--bg); color:var(--fg);
         font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align:center; }
  .logo { font-size:72px; line-height:1; }
  h1 { margin:12px 0 4px; font-size:40px; letter-spacing:-.02em; }
  p { margin:0 0 28px; opacity:.75; }
  a.btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none;
          font-weight:600; padding:14px 28px; border-radius:999px; }
</style>
</head>
<body>
<main>
  <div class="logo">🌸</div>
  <h1>Bloom</h1>
  <p>Ton suivi d'habitudes, tout en douceur.</p>
  <a class="btn" id="open" href="#">Ouvrir Bloom</a>
</main>
<script>
  // ====== À MODIFIER ======
  var APP_STORE_URL = "https://apps.apple.com/ch/app/bloom-habits/id6811036834?l=fr-FR"; // lien App Store de Bloom
  var APP_SCHEME    = "bloom://";                                         // schéma d'ouverture de l'app
  // ========================

  var btn = document.getElementById("open");
  btn.href = APP_STORE_URL;

  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (isIOS) {
    // Tente d'ouvrir l'app ; si elle ne s'ouvre pas, on file sur l'App Store.
    var t = setTimeout(function () { location.href = APP_STORE_URL; }, 1200);
    document.addEventListener("visibilitychange", function () {
      if (document.hidden) clearTimeout(t);
    });
    location.href = APP_SCHEME;
    btn.addEventListener("click", function (e) {
      e.preventDefault();
      location.href = APP_SCHEME;
      setTimeout(function () { location.href = APP_STORE_URL; }, 1200);
    });
  }
</script>
</body>
</html>
