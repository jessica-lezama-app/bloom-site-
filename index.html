<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloom</title>
<meta name="description" content="Bloom, ton suivi d'habitudes tout en douceur.">
<meta name="theme-color" content="#fdf2f4">
<meta http-equiv="refresh" content="0; url=https://apps.apple.com/ch/app/bloom-habits/id6811036834?l=fr-FR">
<style>
  :root { --bg:#fdf2f4; --fg:#3b2a30; --accent:#e0678a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#241a1e; --fg:#f7e9ed; --accent:#f08aa8; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--bg); color:var(--fg);
         font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align:center; }
  .logo { font-size:72px; line-height:1; }
  h1 { margin:12px 0 4px; font-size:40px; letter-spacing:-.02em; }
  p { margin:0 0 28px; opacity:.75; }
  a.btn { display:inline-block; background:var(--accent); color:#fff; text-decoration:none;
          font-weight:600; padding:14px 28px; border-radius:999px; }
</style>
</head>
<body>
<main>
  <div class="logo">🌸</div>
  <h1>Bloom</h1>
  <p>Ton suivi d'habitudes, tout en douceur.</p>
  <a class="btn" href="https://apps.apple.com/ch/app/bloom-habits/id6811036834?l=fr-FR">Télécharger Bloom</a>
</main>
<script>location.replace("https://apps.apple.com/ch/app/bloom-habits/id6811036834?l=fr-FR");</script>
</body>
</html>
